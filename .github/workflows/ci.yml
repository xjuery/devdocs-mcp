name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint & format check (Ruff)
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Run tests
        run: python -m pytest

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Scan for vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt